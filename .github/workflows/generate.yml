name: Generate prebuilt archives
on: [push, pull_request]
permissions:
  contents: write

jobs:
  # Seperate release creation workflow that runs first to avoid a race condition
  create_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: startsWith(github.ref, 'refs/tags/')
      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
  
  generate:
    needs: create_release
    strategy:
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Check out project
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Build and upload tools tarball
      uses: ./.github/actions/build-and-upload-tarball-for-platform
